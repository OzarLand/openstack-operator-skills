name: validate

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      # OzarLand requires actions pinned to a full commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml ruff==0.16.9
      - name: Lint
        run: ruff check .
      - name: Shared references are in sync
        run: python3 tools/sync_shared.py --check
      - name: Structural validation
        run: python3 tools/validate_skills.py
      - name: Weighted model script reproduces the book's example and rejects bad input
        run: python3 tools/test_weighted_score.py
      # Bookkeeping only: tags match the inventory, evidence fields present, coverage
      # figures current. It never shows that an OpenStack procedure works.
      - name: Knowledge validation inventory is consistent
        run: python3 tools/validate_knowledge.py
      - name: Knowledge validator catches injected faults
        run: python3 tools/test_validate_knowledge.py
