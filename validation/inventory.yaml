# Knowledge validation inventory. Policy: docs/knowledge-validation-policy.md
# One entry per procedure or technical claim tagged in a skill. Evidence fields of
# LAB-VALIDATED entries are copied from the source page's confirmed_by record and the
# pull request that added it; this repository did not re-execute them.
# After editing: python3 tools/validate_knowledge.py --write
version: 1
policy: docs/knowledge-validation-policy.md
source_repos:
  openstack-vm-runbooks:
    name: OzarLand/openstack-vm-runbooks
    url: https://github.com/OzarLand/openstack-vm-runbooks
    commit: babdd8c07971
  kolla-ansible-deployment-patterns:
    name: OzarLand/kolla-ansible-deployment-patterns
    url: https://github.com/OzarLand/kolla-ansible-deployment-patterns
    commit: dee2c60b9db4
items:
- id: CR-CERT-01
  claim: Certificate rotation covers every internal and external endpoint, the bus and the database; verification
    of reconnection over TLS and new expiry dates.
  kind: procedure
  risk: state-changing
  skill: openstack-change-review
  location: references/change-type-notes.md
  status: DOCUMENTED-UNVERIFIED
  scope: Any deployment with TLS
  sources:
  - repo: kolla-ansible-deployment-patterns
    path: configuration/tls-on-internal-and-external-endpoints.md
  - book: Ch. 8
  - book: Ch. 17
  missing_evidence: Rotate internal certificates on a TLS-enabled Kolla-Ansible lab and record reconnection behaviour
    of APIs, RabbitMQ (AMQPS) and MariaDB clients.
- id: CR-NET-01
  claim: Restarting some Neutron agents or OVN controllers can briefly interrupt tenant traffic, depending on version
    and configuration.
  kind: behaviour
  risk: state-changing
  skill: openstack-change-review
  location: references/change-type-notes.md
  status: DOCUMENTED-UNVERIFIED
  scope: Any Neutron backend
  sources:
  - repo: openstack-vm-runbooks
    path: networking/restarting-the-ovs-agent-does-not-cut-instances.md
  - book: Ch. 1
  missing_evidence: Measure traffic during restarts of the L3, DHCP and metadata agents (ML2/OVS) and ovn-controller
    (OVN); the OVS agent case is VM-NET-29.
- id: CR-MQ-01
  claim: A RabbitMQ queue's type is fixed at declaration (moving to quorum queues means recreating them), quorum
    queues need a majority, and RabbitMQ 4.0 removed classic mirroring.
  kind: config-fact
  risk: read-only
  skill: openstack-change-review
  location: references/change-type-notes.md
  status: DOCUMENTED-UNVERIFIED
  scope: RabbitMQ 3.8 to 4.x
  sources:
  - doc: https://www.rabbitmq.com/docs/quorum-queues
  - book: Ch. 10
  missing_evidence: Migrate a lab from classic to quorum queues with the owning services stopped and record the
    outage.
- id: CR-UPG-01
  claim: 'Upgrade readiness facts: SLURP rules, branch rename at Unmaintained, *-status upgrade checks with the
    target code, Nova rolling-upgrade sequence and N-2 compute tolerance, Neutron contract phase, RBAC default changes.'
  kind: config-fact
  risk: read-only
  skill: openstack-change-review
  location: references/upgrade-readiness.md
  status: DOCUMENTED-UNVERIFIED
  scope: Upstream OpenStack, 2023.1 onwards
  sources:
  - repo: kolla-ansible-deployment-patterns
    path: version-notes/2025.1-to-2026.1.md
  - book: Ch. 14
  - book: Ch. 17
  - doc: https://releases.openstack.org/
  missing_evidence: A multinode rolling upgrade on a lab following the Nova sequence, with status checks run from
    the target code and policy tests with real accounts; the only recorded lab upgrade is an all-in-one Kolla-Ansible
    run.
- id: AR-ANS-01
  claim: Ansible check mode skips command and shell tasks unless written to support it, so a clean --check run can
    hide most of a shell-heavy playbook.
  kind: behaviour
  risk: read-only
  skill: openstack-automation-review
  location: references/ansible-and-kolla-notes.md
  status: DOCUMENTED-UNVERIFIED
  scope: Ansible core 2.x
  sources:
  - doc: https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_checkmode.html
  missing_evidence: Run a playbook mixing modules and shell tasks with --check --diff and record which tasks are
    skipped.
- id: AR-KA-01
  claim: kolla-ansible destroy is protected by an explicit confirmation flag.
  kind: config-fact
  risk: destructive
  skill: openstack-automation-review
  location: references/ansible-and-kolla-notes.md
  status: DOCUMENTED-UNVERIFIED
  scope: Kolla-Ansible 2026.1
  sources:
  - doc: https://docs.openstack.org/kolla-ansible/latest/user/operating-kolla.html
  missing_evidence: Run kolla-ansible destroy without the flag on a disposable lab and record the refusal (never
    with the flag outside a disposable lab).
- id: IA-CP-01
  claim: RabbitMQ diagnosis on every node (cluster_status, local alarms, queues with messages and consumers, khepri
    feature flag, blocked connections) and the table that separates node missing, partition, alarm and consumers
    gone.
  kind: diagnostic
  risk: read-only
  skill: openstack-incident-analysis
  location: references/control-plane-recovery.md
  status: LAB-VALIDATED
  scope: 2026.1, Kolla-Ansible, RabbitMQ 4.2 (Khepri or Mnesia as written); lab evidence Khepri only
  sources:
  - repo: openstack-vm-runbooks
    path: recovery/rabbitmq-partition-or-alarm-rpc-timeouts.md
  validation:
    environment: 'lab: kolla-ansible 22.2.0, 3 controllers + 2 computes, RabbitMQ 4.2.9 with Khepri; topology as
      recorded: HA control plane, RabbitMQ cluster of three or more nodes'
    openstack_release: '2026.1'
    deployment: kolla-ansible 22.2.0, 3 controllers + 2 computes, RabbitMQ 4.2.9 with Khepri
    network_backend: not recorded on the page (ML2/OVS on the same lab per other pages)
    storage_backend: not recorded
    executed_by: agent:lab-reviewer
    date: '2026-10-27'
    observed: Quick checks run on all three nodes; one node stopped 29 s; one node cut from the two others on port
      25672 for 2.5 min; memory alarm forced with set_vm_memory_high_watermark absolute 10MB for 4.5 min; consumers
      gone seen with nova_conductor / nova_scheduler stopped.
    not_observed: A disk alarm; Mnesia; a partition of more than one node.
    evidence:
    - https://github.com/OzarLand/openstack-vm-runbooks/pull/139
    - https://github.com/OzarLand/openstack-vm-runbooks/blob/babdd8c07971/recovery/rabbitmq-partition-or-alarm-rpc-timeouts.md
    - 'source confirmed_by note: read-only quick checks on every node; cause 1 (one node stopped 29 s, systemctl),
      cause 2 (one node cut from the two others on port 25672 for 2.5 min) and cause 3 (memory alarm with set_vm_memory_high_watermark
      absolute 10MB, 4.5 min) injected and undone; cause 4 seen with nova_conductor/nova_scheduler stopped (#103
      run); verification run. Not run: the partition recovery (stop and start of the untrusted side, healed by itself),
      a disk alarm, rabbitmq-reset-state, Mnesia'
    independent_human_check: false
  revalidate_when: RabbitMQ major or minor upgrade (4.3 removes Mnesia); Kolla-Ansible release change; procedure
    text change.
- id: IA-CP-02
  claim: With RabbitMQ 4.2 and Khepri, a partition shows Network Partitions (none), the minority node does not pause
    and keeps accepting connections, builds fail with MessagingTimeout after 60 s, the partition heals by itself
    once the network returns; a memory alarm on one node blocks publishers cluster-wide and a client that retries
    after a 502 can create a duplicate instance.
  kind: behaviour
  risk: read-only
  skill: openstack-incident-analysis
  location: references/control-plane-recovery.md
  status: LAB-VALIDATED
  scope: RabbitMQ 4.2 with Khepri, Kolla-Ansible 2026.1
  sources:
  - repo: openstack-vm-runbooks
    path: recovery/rabbitmq-partition-or-alarm-rpc-timeouts.md
  - repo: openstack-vm-runbooks
    path: logs/reading-rabbitmq-logs.md
  validation:
    environment: 'lab: kolla-ansible 22.2.0, 3 controllers + 2 computes, RabbitMQ 4.2.9 with Khepri; topology as
      recorded: HA control plane, RabbitMQ cluster of three or more nodes'
    openstack_release: '2026.1'
    deployment: kolla-ansible 22.2.0, 3 controllers + 2 computes, RabbitMQ 4.2.9 with Khepri
    network_backend: not recorded on the page
    storage_backend: not recorded
    executed_by: agent:lab-reviewer
    date: '2026-10-27'
    observed: 'net_tick_timeout 74 s after the cut on both sides, Network Partitions (none) everywhere, one build
      failed with MessagingTimeout after 60 s, healed 4 s after the cut was removed; memory alarm: both computes
      down, every Neutron agent dead, server create 502 after 60 s while nova-api completed the request once the
      alarm cleared.'
    not_observed: Mnesia and pause_minority behaviour; partitions of more than one node.
    evidence:
    - https://github.com/OzarLand/openstack-vm-runbooks/pull/139
    - https://github.com/OzarLand/openstack-vm-runbooks/blob/babdd8c07971/recovery/rabbitmq-partition-or-alarm-rpc-timeouts.md
    - 'source confirmed_by note: read-only quick checks on every node; cause 1 (one node stopped 29 s, systemctl),
      cause 2 (one node cut from the two others on port 25672 for 2.5 min) and cause 3 (memory alarm with set_vm_memory_high_watermark
      absolute 10MB, 4.5 min) injected and undone; cause 4 seen with nova_conductor/nova_scheduler stopped (#103
      run); verification run. Not run: the partition recovery (stop and start of the untrusted side, healed by itself),
      a disk alarm, rabbitmq-reset-state, Mnesia'
    independent_human_check: false
  revalidate_when: RabbitMQ version change; metadata store change; Kolla-Ansible release change.
- id: IA-CP-03
  claim: RabbitMQ fixes for a missing node (start the systemd unit), an alarm (free the resource, alarm clears)
    and consumers gone (restart the consuming service unit).
  kind: procedure
  risk: state-changing
  skill: openstack-incident-analysis
  location: references/control-plane-recovery.md
  status: LAB-VALIDATED
  scope: Kolla-Ansible 2026.1, RabbitMQ 4.2 Khepri
  sources:
  - repo: openstack-vm-runbooks
    path: recovery/rabbitmq-partition-or-alarm-rpc-timeouts.md
  - repo: openstack-vm-runbooks
    path: recovery/nova-conductor-or-scheduler-down-what-still-works.md
  validation:
    environment: 'lab: kolla-ansible 22.2.0, 3 controllers + 2 computes, RabbitMQ 4.2.9 with Khepri; topology as
      recorded: HA control plane, RabbitMQ cluster of three or more nodes'
    openstack_release: '2026.1'
    deployment: kolla-ansible 22.2.0, 3 controllers + 2 computes, RabbitMQ 4.2.9 with Khepri
    network_backend: not recorded on the page
    storage_backend: not recorded
    executed_by: agent:lab-reviewer
    date: '2026-10-27'
    observed: Stopped node started through kolla-rabbitmq-container.service, running 40 s later; alarm undone with
      set_vm_memory_high_watermark 0.6, every service up within 16 s and the stuck build ACTIVE within 26 s; consuming
      services (conductors) restarted through their units.
    not_observed: Freeing real memory or disk; a disk alarm; stream replica repair after a node outage.
    evidence:
    - https://github.com/OzarLand/openstack-vm-runbooks/pull/139
    - https://github.com/OzarLand/openstack-vm-runbooks/blob/babdd8c07971/recovery/rabbitmq-partition-or-alarm-rpc-timeouts.md
    - 'source confirmed_by note: read-only quick checks on every node; cause 1 (one node stopped 29 s, systemctl),
      cause 2 (one node cut from the two others on port 25672 for 2.5 min) and cause 3 (memory alarm with set_vm_memory_high_watermark
      absolute 10MB, 4.5 min) injected and undone; cause 4 seen with nova_conductor/nova_scheduler stopped (#103
      run); verification run. Not run: the partition recovery (stop and start of the untrusted side, healed by itself),
      a disk alarm, rabbitmq-reset-state, Mnesia'
    independent_human_check: false
  revalidate_when: RabbitMQ or Kolla-Ansible version change; procedure text change.
- id: IA-CP-04
  claim: 'Recovery of a partition that does not heal: choose the trusted side, export definitions, stop every untrusted
    node before starting any, then restart the trusted nodes one at a time.'
  kind: procedure
  risk: destructive
  skill: openstack-incident-analysis
  location: references/control-plane-recovery.md
  status: DOCUMENTED-UNVERIFIED
  scope: RabbitMQ 4.2 (Mnesia, or a suspended-and-resumed node), Kolla-Ansible 2026.1
  sources:
  - repo: openstack-vm-runbooks
    path: recovery/rabbitmq-partition-or-alarm-rpc-timeouts.md
  - doc: https://www.rabbitmq.com/docs/4.2/partitions
  missing_evidence: Reproduce a persistent partition on a three-node RabbitMQ 4.2 cluster with Mnesia (or a suspended
    node), run the stop-all-untrusted-then-start sequence, verify one cluster, consumers back and a test build.
- id: IA-CP-05
  claim: With Khepri, force_reset is refused and kolla-ansible rabbitmq-reset-state failed, leaving one node stopped
    outside the cluster; the node was recovered with reset, join_cluster, start_app; quorum queue and stream members
    were missing on it and were repaired with rabbitmq-streams add_replica and rabbitmq-queues grow, after which
    DHCP needed a hard reboot of an instance.
  kind: procedure
  risk: destructive
  skill: openstack-incident-analysis
  location: references/control-plane-recovery.md
  status: LAB-VALIDATED
  scope: Kolla-Ansible 22.2.0 (2026.1), RabbitMQ 4.2.9 with Khepri, quorum queues and stream fanout
  sources:
  - repo: openstack-vm-runbooks
    path: recovery/reopening-provisioning-after-control-plane-incident.md
  validation:
    environment: 'lab: kolla-ansible 22.2.0, 3 controllers, RabbitMQ 4.2.9 with Khepri, Galera with ProxySQL, no
      Cinder; topology as recorded: HA control plane (clustered RabbitMQ, Galera)'
    openstack_release: '2026.1'
    deployment: kolla-ansible 22.2.0, 3 controllers, RabbitMQ 4.2.9 with Khepri, Galera with ProxySQL, no Cinder
    network_backend: ml2/ovs
    storage_backend: no Cinder
    executed_by: 'not recorded on the page (lab run reported in the page text and in the commit of PR #137)'
    date: '2026-10-27'
    observed: force_reset refused; rabbitmq-reset-state failed (reset timed out on one node; others 'Not enough
      nodes joined'); node recovered with reset, join_cluster, start_app; PRECONDITION_FAILED on streams without
      a local replica; add_replica and grow fixed it; instance needed a hard reboot for DHCP.
    not_observed: force_reset or purge_queue outside Kolla-Ansible; Mnesia; the reset was run after the partition
      had healed.
    evidence:
    - https://github.com/OzarLand/openstack-vm-runbooks/pull/137
    - https://github.com/OzarLand/openstack-vm-runbooks/blob/babdd8c07971/recovery/reopening-provisioning-after-control-plane-incident.md
    - 'source confirmed_by note: lab run recorded in the page body; no confirmed_by entry on the source page'
    independent_human_check: false
  revalidate_when: RabbitMQ or Kolla-Ansible version change (rabbitmq-reset-state may be fixed upstream).
  limitations: The source page records this run in its text and commit message but keeps status draft and an empty
    confirmed_by; one run only.
