  missing_evidence: Run the full sequence on a Kolla-Ansible 2026.1 lab with RabbitMQ 4.2 Khepri and with Mnesia;
    the only recorded run of rabbitmq-reset-state on Khepri failed (IA-CP-05).
  limitations: Known to have failed once on a Khepri lab (IA-CP-05).
- id: IA-CP-07
  claim: 'Controlled degradation as run on a lab: stop the API systemd units (not containers), keep placement_api
    and Keystone running, recover, restart conductors, schedulers, nova-compute and agents, verify with the APIs
    needed by the test build (which reopens them on a single VIP), reopen.'
  kind: procedure
  risk: state-changing
  skill: openstack-incident-analysis
  location: references/control-plane-recovery.md
  status: LAB-VALIDATED
  scope: Kolla-Ansible 22.2.0 (2026.1), ML2/OVS, RabbitMQ 4.2 Khepri, single internal VIP
  sources:
  - repo: openstack-vm-runbooks
    path: recovery/reopening-provisioning-after-control-plane-incident.md
  - book: Ch. 19
  validation:
    environment: 'lab: kolla-ansible 22.2.0, 3 controllers, RabbitMQ 4.2.9 with Khepri, Galera with ProxySQL, no
      Cinder; topology as recorded: HA control plane (clustered RabbitMQ, Galera)'
    openstack_release: '2026.1'
    deployment: kolla-ansible 22.2.0, 3 controllers, RabbitMQ 4.2.9 with Khepri, Galera with ProxySQL, no Cinder
    network_backend: ml2/ovs
    storage_backend: no Cinder
    executed_by: 'not recorded on the page (lab run reported in the page text and in the commit of PR #137)'
    date: '2026-10-27'
    observed: 'Steps 1 (API units stopped), 2 (bus reset, which failed: IA-CP-05), 3 (read-only, Galera healthy),
